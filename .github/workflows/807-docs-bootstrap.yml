name: 807 docs bootstrap

on:
  push:
    branches: [feature/807-priority-tiering]

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/807-priority-tiering
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync 807 priority docs
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '[807 v1.3.0 / 待发布]'
          entry = '- 2026-09-09 `[807 v1.3.0 / 待发布]` 807 独立加入 IELTS 听力收益分级：基于原词表场景标题与人工 override 将 1,854 词分为核心 539、重要 744、扩展 571；默认训练改为核心主线，可选核心+重要与全量 807。任何答错词会自动进入个人核心池；核心内未练词优先，已练词按低 streak、高错次和久未复习排序。保留 `marcoIelts807.v1` 与原 1,854 词 ID，不修改 Listening、538、Confusions 或正式词库；新增独立规则、分类器和 CI 校验。\n'
          if marker not in text:
              anchor = '<!-- CHANGELOG_ENTRIES -->\n'
              if anchor not in text:
                  raise SystemExit('CHANGELOG anchor missing')
              text = text.replace(anchor, anchor + entry, 1)
              changelog.write_text(text, encoding='utf-8')

          handoff = Path('docs/HANDOFF.md')
          text = handoff.read_text(encoding='utf-8')
          marker = '2026-09-09 807 v1.3.0 候选'
          paragraph = '2026-09-09 807 v1.3.0 候选：仅 807 子应用新增三档优先级，规则源为 `807/data/priority-rules.json`，分类器读取固定 `source/807.txt` 场景标题后得到核心 539 / 重要 744 / 扩展 571。默认 30 词改为核心池；“核心+重要”和“全量 807”保留；历史错词无论基础档位都动态提升到个人核心。旧 `marcoIelts807.v1` 记录、词项 ID、释义和音频不迁移，Listening v2.20.0 / Confusions v1.2.0 / 正式词库及 538 均不改。新增 `tests/test_807_priorities.js` 与独立 Actions guard；发布前仍需浏览器验收核心/重要/全量/错词四入口、旧 session 接续与离线缓存。\n\n'
          if marker not in text:
              anchor = '## 本轮统一与发布\n\n'
              if anchor not in text:
                  raise SystemExit('HANDOFF anchor missing')
              text = text.replace(anchor, anchor + paragraph, 1)
              handoff.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('独立版本 `v1.2.0`。`source/807.txt`', '独立版本 `v1.3.0`。`source/807.txt`', 1)
          marker = '默认训练只抽“核心”池'
          paragraph = '\n默认训练只抽“核心”池：当前基础分级为核心 539、重要 744、扩展 571；可手动切到“核心+重要”或“全量 807”。分级只存在 807 模块，任何答错词都会动态提升到个人核心；不写入 Listening、538 或 Confusions 的词表和学习记录。\n'
          if marker not in text:
              anchor = '来源、快照日期与校验值保存在 `807/data/terms.json`。\n'
              if anchor not in text:
                  raise SystemExit('README 807 anchor missing')
              text = text.replace(anchor, anchor + paragraph, 1)
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Commit docs
        run: |
          if git diff --quiet -- CHANGELOG.md docs/HANDOFF.md README.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs/HANDOFF.md README.md
          git commit -m "Document 807 priority tiers"
          git push origin HEAD:feature/807-priority-tiering
