name: 807 sequence patch

on:
  push:
    branches: [feature/807-priority-tiering]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/807-priority-tiering
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strict tier sequence and visible labels
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # priorities.js: pure helper so the gating rule is testable.
          replace_once(
              '807/priorities.js',
              '  function classify(terms, sourceText, rules) {',
              '''  function nextUnseenTier(terms, allowedTiers, tierOf, seen) {\n    for (const tier of allowedTiers || []) {\n      if (terms.some(term => tierOf(term) === tier && !seen(term))) return tier;\n    }\n    return null;\n  }\n\n  function classify(terms, sourceText, rules) {'''
          )
          replace_once(
              '807/priorities.js',
              '  return { normalise, parseSource, classify };',
              '  return { normalise, parseSource, classify, nextUnseenTier };'
          )

          # app.js: visible tier badges + strict core -> important -> extended gating.
          replace_once(
              '807/app.js',
              '  const SESSION_MODES = new Set(["core", "priority", "all", "wrong"]);',
              '''  const SESSION_MODES = new Set(["core", "priority", "all", "wrong"]);\n  const TIER_LABELS = { core: "核心", important: "重要", extended: "扩展 · 低优先" };'''
          )
          replace_once(
              '807/app.js',
              '''  function effectiveCoreTerms() {\n    return terms.filter(term => effectiveTier(term) === "core");\n  }\n\n  function coreSeenCount() {''',
              '''  function effectiveCoreTerms() {\n    return terms.filter(term => effectiveTier(term) === "core");\n  }\n\n  function tierBadge(term) {\n    const base = baseTier(term);\n    const promoted = base !== "core" && effectiveTier(term) === "core";\n    const label = TIER_LABELS[base] || "重要";\n    return `<span class="tier-badge tier-${escapeHtml(base)}">${escapeHtml(label)}${promoted ? " · 个人核心" : ""}</span>`;\n  }\n\n  function allowedTiersForMode(mode) {\n    if (mode === "all") return ["core", "important", "extended"];\n    if (mode === "priority") return ["core", "important"];\n    return ["core"];\n  }\n\n  function coreSeenCount() {'''
          )
          replace_once(
              '807/app.js',
              '''  function chooseSessionTerms(mode) {\n    const pool = poolForMode(mode);\n    if (mode === "wrong") return shuffled(pool, `wrong-${Date.now()}`).slice(0, SESSION_SIZE);\n    const unseen = pool.filter(term => !getRecord(term).attempts);\n    const seen = pool.filter(term => getRecord(term).attempts);\n    const salt = `${mode}-${Date.now()}`;\n    seen.sort((left, right) => reviewOrder(left, right, salt));\n    return [\n      ...shuffled(unseen, `unseen-${salt}`),\n      ...seen,\n    ].slice(0, SESSION_SIZE);\n  }''',
              '''  function chooseSessionTerms(mode) {\n    const pool = poolForMode(mode);\n    if (mode === "wrong") return shuffled(pool, `wrong-${Date.now()}`).slice(0, SESSION_SIZE);\n\n    const salt = `${mode}-${Date.now()}`;\n    const allowedTiers = allowedTiersForMode(mode);\n    const activeTier = Vocab807Priority.nextUnseenTier(\n      pool,\n      allowedTiers,\n      effectiveTier,\n      term => getRecord(term).attempts > 0,\n    );\n\n    if (activeTier) {\n      const tierPool = pool.filter(term => effectiveTier(term) === activeTier);\n      const unseen = tierPool.filter(term => !getRecord(term).attempts);\n      const seen = tierPool.filter(term => getRecord(term).attempts);\n      seen.sort((left, right) => reviewOrder(left, right, salt));\n      return [\n        ...shuffled(unseen, `unseen-${activeTier}-${salt}`),\n        ...seen,\n      ].slice(0, SESSION_SIZE);\n    }\n\n    const seen = pool.slice();\n    seen.sort((left, right) => {\n      const tierDelta = allowedTiers.indexOf(effectiveTier(left)) - allowedTiers.indexOf(effectiveTier(right));\n      return tierDelta || reviewOrder(left, right, salt);\n    });\n    return seen.slice(0, SESSION_SIZE);\n  }'''
          )
          replace_once(
              '807/app.js',
              '''      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,\n      mode: safeMode,''',
              '''      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,\n      orderVersion: 2,\n      mode: safeMode,'''
          )
          replace_once(
              '807/app.js',
              '''  function sanitiseSession(session) {\n    if (!session || typeof session !== "object" || !Array.isArray(session.queue)) return null;\n    const queue = session.queue.filter(entry => entry && typeof entry.term === "string").map(entry => ({ ...entry, retryCount: Number.isInteger(entry.retryCount) ? Math.max(0, entry.retryCount) : 0 }));''',
              '''  function sanitiseSession(session) {\n    if (!session || typeof session !== "object" || !Array.isArray(session.queue)) return null;\n    // v1.3 strict-order migration: discard only unfinished old queues; answered history remains in records.\n    if (session.orderVersion !== 2) return null;\n    const queue = session.queue.filter(entry => entry && typeof entry.term === "string").map(entry => ({ ...entry, retryCount: Number.isInteger(entry.retryCount) ? Math.max(0, entry.retryCount) : 0 }));'''
          )
          replace_once(
              '807/app.js',
              '      mode: SESSION_MODES.has(session.mode) ? session.mode : "all",',
              '      orderVersion: 2,\n      mode: SESSION_MODES.has(session.mode) ? session.mode : "core",'
          )
          replace_once(
              '807/app.js',
              '<p>默认只练核心词。原 1,854 词完整保留；做错的词会自动进入个人核心池，不影响主 App、538 或易混词。</p>',
              '<p>默认先练核心词；即使进入“核心 + 重要”或“全量”，也会严格按核心 → 重要 → 扩展推进。做错的词自动进入个人核心池。</p>'
          )
          replace_once(
              '807/app.js',
              '<span>基础分级：核心 ${counts.core} · 重要 ${counts.important} · 扩展 ${counts.extended}</span>',
              '<span>基础分级：核心 ${counts.core} · 重要 ${counts.important} · 扩展 ${counts.extended}（低优先）</span>'
          )
          replace_once(
              '807/app.js',
              '''        <p class="feedback-label">正确</p>\n        <h2 class="answer-word">${escapeHtml(term)}</h2>''',
              '''        <p class="feedback-label">正确</p>\n        ${tierBadge(term)}\n        <h2 class="answer-word">${escapeHtml(term)}</h2>'''
          )
          replace_once(
              '807/app.js',
              '''        <p class="feedback-label">${skipped ? "先跳过" : "拼写不对"}</p>\n        <h2 class="answer-word">${escapeHtml(entry.term)}</h2>''',
              '''        <p class="feedback-label">${skipped ? "先跳过" : "拼写不对"}</p>\n        ${tierBadge(entry.term)}\n        <h2 class="answer-word">${escapeHtml(entry.term)}</h2>'''
          )
          replace_once(
              '807/app.js',
              '''          <span class="mode-label">${entry.isRetry ? "回炉题" : escapeHtml(modeLabel(activeSession.mode))}</span>''',
              '''          <div class="question-meta">\n            <span class="mode-label">${entry.isRetry ? "回炉题" : escapeHtml(modeLabel(activeSession.mode))}</span>\n            ${tierBadge(entry.term)}\n          </div>'''
          )

          # CSS for the visible badge.
          style = Path('807/style.css')
          css = style.read_text(encoding='utf-8')
          marker = '.tier-badge {'
          if marker in css:
              raise SystemExit('tier badge CSS already exists')
          css += '''\n.training-toolbar .question-meta { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }\n.tier-badge { display: inline-flex; align-items: center; width: fit-content; margin-inline: auto; padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 750; line-height: 1.2; }\n.question-meta .tier-badge { margin-inline: 0; }\n.tier-core { background: #ffe8e6; color: #b42318; }\n.tier-important { background: #fff3d6; color: #8a5200; }\n.tier-extended { background: #ececf1; color: #636366; }\n'''
          style.write_text(css, encoding='utf-8')

          # Cache-bust changed assets.
          replace_once('807/index.html', './style.css?v=2', './style.css?v=3')
          replace_once('807/index.html', './app.js?v=4', './app.js?v=5')
          replace_once('807/sw.js', 'const CACHE = "ielts-807-v1.3.0";', 'const CACHE = "ielts-807-v1.3.0-r2";')
          replace_once('807/sw.js', '"./style.css?v=2"', '"./style.css?v=3"')
          replace_once('807/sw.js', '"./app.js?v=4"', '"./app.js?v=5"')

          # Tests: behavioral gate for tier progression + source wiring assertions.
          test = Path('tests/test_807_priorities.js')
          text = test.read_text(encoding='utf-8')
          anchor = 'assert.strictEqual(result.counts.core + result.counts.important + result.counts.extended, 1854);\n'
          addition = '''assert.strictEqual(Priority.nextUnseenTier(["c1", "i1", "e1"], ["core", "important", "extended"], term => ({ c1: "core", i1: "important", e1: "extended" })[term], term => term === "c1"), "important", "核心覆盖完后才能进入重要");\nassert.strictEqual(Priority.nextUnseenTier(["c1", "i1", "e1"], ["core", "important", "extended"], term => ({ c1: "core", i1: "important", e1: "extended" })[term], () => false), "core", "存在未覆盖核心时必须锁在核心");\nassert.strictEqual(Priority.nextUnseenTier(["c1", "i1", "e1"], ["core", "important", "extended"], term => ({ c1: "core", i1: "important", e1: "extended" })[term], term => term !== "e1"), "extended", "核心和重要覆盖完后才能进入扩展");\n'''
          if addition.strip() in text:
              raise SystemExit('sequence tests already exist')
          if anchor not in text:
              raise SystemExit('test anchor missing')
          text = text.replace(anchor, anchor + addition, 1)
          text += '''\nconst appSource = fs.readFileSync(path.join(root, "807/app.js"), "utf8");\nassert(appSource.includes('session.orderVersion !== 2'), "旧的无优先级队列必须失效，避免继续从全量池出题");\nassert(appSource.includes('tierBadge(entry.term)'), "听写题面必须显示当前词优先级标签");\nassert(appSource.includes('nextUnseenTier'), "出题必须使用严格层级推进");\n'''
          test.write_text(text, encoding='utf-8')

          # Docs stay in sync with actual behavior.
          replace_once(
              'README.md',
              '默认训练只抽“核心”池：当前基础分级为核心 551、重要 742、扩展 561；可手动切到“核心+重要”或“全量 807”。分级只存在 807 模块，任何答错词都会动态提升到个人核心；不写入 Listening、538 或 Confusions 的词表和学习记录。',
              '默认训练从“核心”池开始：当前基础分级为核心 551、重要 742、扩展 561；可手动切到“核心+重要”或“全量 807”，但所有非错词模式都严格按核心 → 重要 → 扩展推进，当前层仍有未覆盖词时不会跨层抽题。每道听写题和答题反馈都会显示该词的基础标签；扩展标为低优先。分级只存在 807 模块，任何答错词都会动态提升到个人核心；不写入 Listening、538 或 Confusions 的词表和学习记录。'
          )
          replace_once(
              'CHANGELOG.md',
              '任何答错词会自动进入个人核心池；核心内未练词优先，已练词按低 streak、高错次和久未复习排序。',
              '任何答错词会自动进入个人核心池；非错词模式严格按核心 → 重要 → 扩展推进，当前层有未覆盖词时不跨层抽题；听写题面和反馈显示基础优先级标签。核心内未练词优先，已练词按低 streak、高错次和久未复习排序。'
          )
          replace_once(
              'docs/HANDOFF.md',
              '默认 30 词改为核心池；“核心+重要”和“全量 807”保留；历史错词无论基础档位都动态提升到个人核心。',
              '默认 30 词改为核心池；“核心+重要”和“全量 807”保留，但全部非错词模式严格按核心 → 重要 → 扩展推进，当前层存在未覆盖词时不跨层；题面和反馈显示当前词基础标签。历史错词无论基础档位都动态提升到个人核心。'
          )
          PY
      - name: Validate patched behavior
        run: |
          node tests/test_807_priorities.js
          node --check 807/priorities.js
          node --check 807/app.js
          node --check 807/sw.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/807-sequence-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 807/app.js 807/priorities.js 807/style.css 807/index.html 807/sw.js tests/test_807_priorities.js README.md CHANGELOG.md docs/HANDOFF.md .github/workflows/807-sequence-patch.yml
          git commit -m "807: enforce core-first sequence and show tier tags"
          git push origin HEAD:feature/807-priority-tiering
