name: 807 count snapshot

on:
  push:
    branches: [feature/807-priority-tiering]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/807-priority-tiering
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute tier counts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const Priority = require('./807/priorities.js');
          const terms = JSON.parse(fs.readFileSync('./807/data/terms.json', 'utf8')).terms;
          const rules = JSON.parse(fs.readFileSync('./807/data/priority-rules.json', 'utf8'));
          const source = fs.readFileSync('./source/807.txt', 'utf8');
          const result = Priority.classify(terms, source, rules);
          fs.writeFileSync('./807/data/priority-counts.tmp.json', JSON.stringify({ counts: result.counts, missingFromSource: result.missingFromSource, unknownOverrides: result.unknownOverrides }, null, 2) + '\n');
          NODE
      - name: Commit snapshot
        run: |
          if git diff --quiet -- 807/data/priority-counts.tmp.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 807/data/priority-counts.tmp.json
          git commit -m "chore: snapshot 807 priority counts"
          git push origin HEAD:feature/807-priority-tiering
