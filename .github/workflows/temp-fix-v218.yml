name: One-time v2.18 QA fix

on:
  push:
    branches:
      - codex/error-word-mainline
    paths:
      - .github/workflows/temp-fix-v218.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/error-word-mainline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed fixes
        run: python scripts/temp_fix_v218.py
      - name: Run logic tests
        run: node tests/test_logic.js
      - name: Validate release
        run: python scripts/validate_release.py
      - name: Commit fixed candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fix-v218.yml scripts/temp_fix_v218.py
          git add app.js tests/test_logic.js CHANGELOG.md docs/HANDOFF.md
          git commit -m "Fix v2.18 error-word review state handling"
          git push origin HEAD:codex/error-word-mainline
