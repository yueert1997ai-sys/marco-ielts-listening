name: 807 finalize docs

on:
  push:
    branches: [feature/807-priority-tiering]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/807-priority-tiering
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update final 807 counts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '核心 539、重要 744、扩展 571': '核心 551、重要 742、扩展 561',
              '核心 539 / 重要 744 / 扩展 571': '核心 551 / 重要 742 / 扩展 561',
          }
          for name in ['CHANGELOG.md', 'README.md', 'docs/HANDOFF.md']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = text
              for before, after in replacements.items():
                  text = text.replace(before, after)
              if text == old:
                  raise SystemExit(f'expected old count text missing in {name}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot helper
        run: rm .github/workflows/807-finalize-docs.yml
      - name: Commit final docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md README.md docs/HANDOFF.md .github/workflows/807-finalize-docs.yml
          git commit -m "Finalize 807 priority tier counts"
          git push origin HEAD:feature/807-priority-tiering
