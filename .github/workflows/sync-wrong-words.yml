name: Sync wrong words

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: wrong-word-sync
  cancel-in-progress: false

jobs:
  import:
    if: github.actor == 'yueert1997ai-sys' && (startsWith(github.event.issue.title, '[错词同步]') || startsWith(github.event.issue.title, '[词库管理]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python scripts/import_wrong_words.py --github-event "$GITHUB_EVENT_PATH"
      - run: python scripts/build_listening.py
      - run: python scripts/generate_audio.py
      - run: python scripts/validate_release.py
      - run: node tests/test_logic.js
      - run: python -m unittest tests/test_vocabulary_admin.py tests/test_project_docs.py
      - name: Update project handoff docs
        run: python scripts/update_project_docs.py --github-event "$GITHUB_EVENT_PATH"
      - run: python scripts/check_docs_sync.py
      - name: Stamp vocabulary revision
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["contentRevision"] = f"词库#{os.environ['ISSUE_NUMBER']}"
          data["contentUpdatedAt"] = datetime.now(timezone.utc).date().isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit vocabulary update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/custom_words.json source/vocabulary_overrides.json data/listening.json data/audit.json audio CHANGELOG.md docs/HANDOFF.md version.json
          if git diff --cached --quiet; then
            echo "No vocabulary change"
          else
            git commit -m "Sync vocabulary operations from issue #${{ github.event.issue.number }}"
            git push
          fi
      - name: Close intake issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body $'<!-- marco-sync:published -->\n词库操作已通过校验并同步到训练端。'
          gh issue close "${{ github.event.issue.number }}"
      - name: Report sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body $'<!-- marco-sync:failed -->\n词库同步失败，未发布半成品。修正后可重试。'
