<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IELTS Listening">
  <meta name="description" content="每天 25 个听音拼写 + 25 个选项词义，并用方位检测训练英语空间反射。">
  <link rel="manifest" href="./manifest.webmanifest?v=v2.18.4">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./vendor/phosphor/phosphor-regular.css?v=v2.18.4">
  <link rel="stylesheet" href="./style.css?v=v2.18.4">
  <style>
    .home-build-version {
      display: none;
      min-height: 32px;
      align-items: center;
      color: #6c6c70;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .home-mode .home-build-version { display: flex; }
  </style>
  <title>IELTS Listening 50</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <header class="topbar">
      <div class="topbar-copy">
        <h1 class="app-title">IELTS LISTENING</h1>
        <p id="screen-title" class="screen-title">今日新词</p>
      </div>
      <div class="topbar-meta">
        <button id="app-version" class="version-badge" type="button" aria-label="当前版本 v2.18.4，点击检查更新">v2.18.4</button>
        <div id="home-build-version" class="home-build-version" aria-label="当前发布版本">v2.18.4 · 词库#20</div>
        <div id="day-count" class="day-count" aria-label="今日进度">0/50</div>
      </div>
    </header>
    <div id="signal-rail" class="signal-rail" aria-hidden="true"></div>
    <main id="screen" class="screen"></main>
  </div>
  <noscript>需要开启 JavaScript 才能训练。</noscript>
  <script src="./app.js?v=v2.18.4"></script>
